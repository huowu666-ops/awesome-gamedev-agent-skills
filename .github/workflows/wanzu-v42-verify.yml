name: Wanzu V42 verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/wanzu-zhengdao/v42/**'
      - '.github/workflows/wanzu-v42-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild, compare and test V42
        run: |
          set -eu
          release="$GITHUB_WORKSPACE/projects/wanzu-zhengdao/v42"
          unzip -q "$release/Wanzu-V42-dev.zip" -d "$RUNNER_TEMP/wanzu"
          cd "$RUNNER_TEMP/wanzu/projects/wanzu-zhengdao"
          python scripts/build_v42.py
          cmp index.html "$release/index.html"
          node tests/test_v41_logic.cjs
          node tests/test_v42_logic.cjs
      - name: Touch UI and reload on Chromium
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          cd "$RUNNER_TEMP/wanzu/projects/wanzu-zhengdao"
          python tests/test_v42_touch.py
