name: Wanzu save boundaries
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/wanzu-zhengdao/v56/**'
      - '.github/scripts/wanzu-save-boundaries.cjs'
      - '.github/workflows/wanzu-save-boundaries.yml'
permissions:
  contents: read
jobs:
  story-save-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate released V56 save boundaries
        run: node .github/scripts/wanzu-save-boundaries.cjs projects/wanzu-zhengdao/v56/index.html
